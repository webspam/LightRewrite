name: Create Mod Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag (e.g., v1.0.0)"
        required: true
        type: string
      title:
        description: "Title (defaults to tag)"
        required: false
        type: string
      summary:
        description: "Summary (appears above auto-generated notes)"
        required: false
        type: string
      prerelease:
        description: "Mark as pre-release"
        required: false
        type: boolean
        default: true

jobs:
  create-release:
    runs-on: windows-2022
    permissions:
      contents: write
    env:
      WCC_LITE_PATH: ${{ github.workspace }}\tools\wcc_lite\bin\x64_RedKit\wcc_lite.exe
      WCC_LITE_COMPILER: ${{ github.workspace }}\tools\wcc_lite\bin\x64_RedKit\wcc_lite.exe
      WITCHER_CONTENT0_PATH: ${{ github.workspace }}\tools\wcc_lite\r4data

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Reject version lower than latest
        shell: pwsh
        env:
          NEW_TAG: ${{ inputs.tag }}
        run: |
          $latestVersion = git ls-remote --tags --refs origin |
            ForEach-Object { [semver]($_ -replace '^.*refs/tags/v?', '') } |
            Sort-Object -Bottom 1
          if ([semver]$env:NEW_TAG.TrimStart('v') -lt $latestVersion) {
            throw "$env:NEW_TAG is lower than latest version $latestVersion"
          }

      - name: Checkout wcc_lite
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: webspam/wcc_lite_private
          ref: a9113176a3df475a6ee3c2a311cc08ce564ed4ff
          token: ${{ secrets.WCC_LITE_PRIVATE_TOKEN }}
          path: tools/wcc_lite
          lfs: true

      - name: Build
        shell: pwsh
        run: ./build.ps1 -Compile

      - name: Create zip file
        shell: pwsh
        run: |
          $zipPath = "modLightRewrite-${{ inputs.tag }}.zip"
          Copy-Item -Recurse -Force bin build\bin
          Push-Location build
          Compress-Archive -Path dlc, mods, bin -DestinationPath $zipPath -Force
          Pop-Location

      - name: Create Draft Release
        shell: pwsh
        run: |
          $releaseTitle = "${{ inputs.title }}"
          if ([string]::IsNullOrWhiteSpace($releaseTitle)) { $releaseTitle = "${{ inputs.tag }}" }

          $releaseArgs = @()
          if ("${{ inputs.prerelease }}" -eq "true") { $releaseArgs += "--prerelease" }

          if (-not [string]::IsNullOrWhiteSpace("${{ inputs.summary }}")) {
            "${{ inputs.summary }}" | Out-File -FilePath "summary.md" -Encoding utf8
            $releaseArgs += "--notes-file", "summary.md"
          }

          gh release create "${{ inputs.tag }}" `
            --title $releaseTitle `
            --draft `
            @releaseArgs `
            --generate-notes `
            "build/modLightRewrite-${{ inputs.tag }}.zip"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
